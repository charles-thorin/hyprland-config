# Lock screen: your current wallpaper, blurred, with a pale clock.
general {
    hide_cursor = true
}
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}
label {                           # time
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    font_family = Cinzel
    font_size = 96
    color = rgba(232, 236, 242, 0.95)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(191, 224, 255, 0.45)
    position = 0, 170
    halign = center
    valign = center
}
label {                           # date
    monitor =
    text = cmd[update:60000] date +'%A · %d %B'
    font_family = Cinzel
    font_size = 18
    color = rgba(201, 208, 219, 0.85)
    position = 0, 70
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 52
    rounding = 26
    outline_thickness = 1
    outer_color = rgba(232, 236, 242, 0.55)
    inner_color = rgba(11, 13, 18, 0.6)
    font_color = rgba(232, 236, 242, 1)
    check_color = rgba(191, 224, 255, 0.9)
    fail_color = rgba(240, 138, 36, 0.9)
    fail_text = The way is shut
    placeholder_text = <i>Rest, little knight…</i>
    fade_on_empty = false
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}
