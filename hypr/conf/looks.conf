# ── Looks: pale, spectral, quiet ────────────────
# Palette
#   void      #0b0d12   background
#   pale      #e8ecf2   spectral white (UI, borders)
#   soul      #bfe0ff   soft blue glow (focus)
#   infection #f08a24   only for urgent things

general {
    gaps_in = 4
    gaps_out = 6, 10, 10, 10          # top right bottom left
    border_size = 2
    col.active_border = rgba(e8ecf2ee) rgba(bfe0ffaa) 45deg
    col.inactive_border = rgba(2a2f3a88)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96

    # Focus aid: windows you are not using fade slightly into the dark
    dim_inactive = true
    dim_strength = 0.12

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(bfe0ff22)            # faint ghostly glow around the focused window
        color_inactive = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.15
    }
}

animations {
    enabled = true
    # Soft, drifting motion — like dust in the Ancient Basin
    bezier = drift, 0.22, 1, 0.36, 1
    bezier = soft, 0.4, 0, 0.2, 1
    animation = windows, 1, 4, drift, popin 92%
    animation = windowsOut, 1, 3, soft, popin 92%
    animation = border, 1, 8, soft
    animation = fade, 1, 4, soft
    animation = layers, 1, 3, drift, fade
    animation = workspaces, 1, 4, drift, slidefade 12%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = false     # apps can't steal your focus
    background_color = rgb(0b0d12)
}
