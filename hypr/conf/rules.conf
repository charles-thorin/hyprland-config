# ── Window & layer rules ────────────────────────
# Hyprland changed the rule syntax in recent versions, so nothing here is
# active yet — uncomment the block that matches your `hyprctl version`.
#
# Hyprland 0.53 and newer:
# windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
# windowrule = match:title ^(Picture-in-Picture)$, float on, pin on
# layerrule  = match:namespace ^(waybar|notifications|launcher|logout_dialog)$, blur on
#
# Hyprland 0.48 – 0.52:
# windowrule = float, class:^(org.pulseaudio.pavucontrol)$
# windowrule = float, title:^(Picture-in-Picture)$
# windowrule = pin, title:^(Picture-in-Picture)$
# layerrule  = blur, waybar
# layerrule  = blur, notifications
# layerrule  = blur, launcher
# layerrule  = blur, logout_dialog
