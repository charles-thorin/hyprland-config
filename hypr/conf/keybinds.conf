# ── Keybinds ────────────────────────────────────
# Every bind has a description, so  Super + /  can list them all.
# Workspace keys use keycodes, so they work on QWERTY and AZERTY alike.
$mod = SUPER

# Apps (same order as the dock)
bindd = $mod, Return, Open terminal, exec, $terminal
bindd = $mod, B, Open browser, exec, $browser
bindd = $mod, P, Open Krita (paint), exec, $paint
bindd = $mod, E, Open file manager, exec, $files
bindd = $mod, Space, App launcher, exec, $launcher

# Focus & help
bindd = $mod, Z, Toggle focus mode, exec, $scripts/focus-mode.sh
bindd = $mod, slash, Show all keybinds, exec, $scripts/keybinds.sh
bindd = $mod, W, Next wallpaper, exec, $scripts/wallpaper.sh
bindd = $mod, Escape, Power menu, exec, wlogout -b 5
bindd = $mod ALT, L, Lock screen, exec, loginctl lock-session

# Windows
bindd = $mod, Q, Close window, killactive,
bindd = $mod, F, Fullscreen, fullscreen, 0
bindd = $mod SHIFT, F, Maximize (keep bar), fullscreen, 1
bindd = $mod, V, Float / tile window, togglefloating,
bindd = $mod, J, Swap split direction, togglesplit,

# Move focus: arrows
bindd = $mod, left, Focus left, movefocus, l
bindd = $mod, right, Focus right, movefocus, r
bindd = $mod, up, Focus up, movefocus, u
bindd = $mod, down, Focus down, movefocus, d
# Move window: Shift + arrows
bindd = $mod SHIFT, left, Move window left, movewindow, l
bindd = $mod SHIFT, right, Move window right, movewindow, r
bindd = $mod SHIFT, up, Move window up, movewindow, u
bindd = $mod SHIFT, down, Move window down, movewindow, d
# Resize: Ctrl + arrows
binded = $mod CTRL, left, Shrink width, resizeactive, -40 0
binded = $mod CTRL, right, Grow width, resizeactive, 40 0
binded = $mod CTRL, up, Shrink height, resizeactive, 0 -40
binded = $mod CTRL, down, Grow height, resizeactive, 0 40

# Workspaces 1–9 (number row)
bindd = $mod, code:10, Workspace 1, workspace, 1
bindd = $mod, code:11, Workspace 2, workspace, 2
bindd = $mod, code:12, Workspace 3, workspace, 3
bindd = $mod, code:13, Workspace 4, workspace, 4
bindd = $mod, code:14, Workspace 5, workspace, 5
bindd = $mod, code:15, Workspace 6, workspace, 6
bindd = $mod, code:16, Workspace 7, workspace, 7
bindd = $mod, code:17, Workspace 8, workspace, 8
bindd = $mod, code:18, Workspace 9, workspace, 9
bindd = $mod SHIFT, code:10, Send window to 1, movetoworkspace, 1
bindd = $mod SHIFT, code:11, Send window to 2, movetoworkspace, 2
bindd = $mod SHIFT, code:12, Send window to 3, movetoworkspace, 3
bindd = $mod SHIFT, code:13, Send window to 4, movetoworkspace, 4
bindd = $mod SHIFT, code:14, Send window to 5, movetoworkspace, 5
bindd = $mod SHIFT, code:15, Send window to 6, movetoworkspace, 6
bindd = $mod SHIFT, code:16, Send window to 7, movetoworkspace, 7
bindd = $mod SHIFT, code:17, Send window to 8, movetoworkspace, 8
bindd = $mod SHIFT, code:18, Send window to 9, movetoworkspace, 9
bindd = $mod, Tab, Previous workspace, workspace, previous
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up, Previous workspace, workspace, e-1

# Scratchpad: a hidden workspace you can summon over anything
bindd = $mod, S, Show / hide scratchpad, togglespecialworkspace, scratch
bindd = $mod SHIFT, S, Send window to scratchpad, movetoworkspace, special:scratch

# Mouse: Super + drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots
bindd = , Print, Screenshot a region, exec, grim -g "$(slurp)" - | wl-copy
bindd = SHIFT, Print, Screenshot the screen, exec, grim - | wl-copy

# Media & hardware keys (work on the lock screen too)
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl s 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl s 5%-
