#  ╭──────────────────────────────────────────────╮
#  │  HALLOWNEST · a calm Hyprland setup          │
#  │  Each part lives in conf/ — edit what you    │
#  │  need, nothing else has to change.           │
#  ╰──────────────────────────────────────────────╯

source = ~/.config/hypr/conf/programs.conf   # which apps you use (edit first!)
source = ~/.config/hypr/conf/monitors.conf   # screens
source = ~/.config/hypr/conf/env.conf        # environment variables
source = ~/.config/hypr/conf/input.conf      # keyboard, mouse, touchpad
source = ~/.config/hypr/conf/looks.conf      # colors, gaps, blur, animations
source = ~/.config/hypr/conf/keybinds.conf   # shortcuts (Super + / shows them all)
source = ~/.config/hypr/conf/rules.conf      # per-window rules
source = ~/.config/hypr/conf/autostart.conf  # what starts at login
