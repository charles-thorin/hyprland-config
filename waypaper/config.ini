# Waypaper settings. install.sh copies this to ~/.config/waypaper/config.ini
# once. Waypaper rewrites that copy itself to remember your wallpaper, so
# edit it there afterwards.
[Settings]
folder = ~/Pictures/Wallpapers
backend = @BACKEND@
fill = fill
sort = name
subfolders = True
number_of_columns = 4
swww_transition_type = fade
swww_transition_duration = 2
swww_transition_fps = 60
